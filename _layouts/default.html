<!DOCTYPE html>
<html lang="en">

{% include head.html %}

<body class="{% if page.url == '/' %}home-page{% endif %}">

  {% if site.data.settings.google_analytics %}
    {% include google-analytics.html %}
  {% endif %}

  <!-- begin global wrap -->
  <div class="global-wrap">
  
    {% include header.html %}
  
    <!-- begin content -->
    <main class="content" aria-label="Content">
      {{ content }}
    </main>
    <!-- end content -->

    {% include footer.html %}

    {% include theme-toggle.html %}
  </div>
  <!-- end global wrap -->

  <script src="{{ site.baseurl }}/js/scripts.js"></script>
  <!-- data-cfasync="false" for the same reason as the pre-paint script in
       head.html: Rocket Loader would otherwise defer this to after load,
       leaving the theme toggle, menu and search dead until it ran. -->
  <script data-cfasync="false" src="{{ site.baseurl }}/js/common.js"></script>
</body>

</html>
