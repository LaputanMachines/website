<!DOCTYPE html>
<!-- The inline canvas paint is on the tag itself so it applies before the
     render-blocking font stylesheets load, instead of flashing white. -->
<html lang="en" style="color-scheme: light; background-color: #fff;">

{% include head.html %}

<body class="{% if page.url == '/' %}home-page{% endif %}">

  <!-- begin global wrap -->
  <div class="global-wrap">
  
    {% include header.html %}
  
    <!-- begin content -->
    <main class="content" aria-label="Content">
      {{ content }}
    </main>
    <!-- end content -->

    {% include footer.html %}

  </div>
  <!-- end global wrap -->

  <!-- data-cfasync="false" stops Rocket Loader deferring these to after load,
       which would leave the menu and search dead until they ran. scripts.js
       needs it too: it defines the libraries common.js calls on
       DOMContentLoaded, so deferring it alone makes that first run throw. -->
  <script data-cfasync="false" src="{{ site.baseurl }}/js/scripts.js"></script>
  <script data-cfasync="false" src="{{ site.baseurl }}/js/common.js"></script>
</body>

</html>
