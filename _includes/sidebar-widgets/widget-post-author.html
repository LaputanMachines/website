{% assign author = site.authors | where: 'username', page.author | first %}
{% if author %}
<div class="widget-sidebar widget-post-author">

  <h2 class="post-author-name">
    <a href="/about">{{ author.name }}</a>
  </h2>
  {% if author.content %}
  <p class="post-author-description">{{ author.content }}</p>
  {% endif %}
</div>
{% endif %}
