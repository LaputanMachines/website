---
layout: default
---

<!-- begin page -->
<div class="container">

  <article class="page">
    <div class="page__head">
      <div class="page__info">
        {% if page.permalink == "/about/" %}
        <h1 class="page__title">Hello! I'm Michael Bassili</h1>
        {% else %}
        <h1 class="page__title">{{ page.title | escape }}</h1>
        {% endif %}
        {% if page.description %}
        <div class="page__description">{{ page.description }}</div>
        {% endif %}
      </div>
    
      {% if page.image %}
      <div class="page-image">
        <img src="{{ site.baseurl }}{{ page.image }}" alt="{{ page.title }}" loading="lazy">
      </div>
      {% endif %}
    </div>

    <div class="page__content">
      {{ content }}
    </div>
  </article>

</div>
<!-- end page -->
