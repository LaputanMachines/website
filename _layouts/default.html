<!DOCTYPE html>
<!-- The inline canvas paint is on the tag itself so it applies before the
     render-blocking font stylesheets load, instead of flashing white. -->
<html lang="en" style="color-scheme: dark; background-color: #181818;">

{% include head.html %}

<body class="{% if page.url == '/' %}home-page{% endif %}">

  {% if site.data.settings.google_analytics %}
    {% include google-analytics.html %}
  {% endif %}

  <!-- begin global wrap -->
  <div class="global-wrap">
  
    {% include header.html %}
  
    <!-- begin content -->
    <main class="content" aria-label="Content">
      {{ content }}
    </main>
    <!-- end content -->

    {% include footer.html %}

  </div>
  <!-- end global wrap -->

  <script src="{{ site.baseurl }}/js/scripts.js"></script>
  <!-- data-cfasync="false" stops Rocket Loader deferring this to after load,
       which would leave the menu and search dead until it ran. -->
  <script data-cfasync="false" src="{{ site.baseurl }}/js/common.js"></script>
</body>

</html>
